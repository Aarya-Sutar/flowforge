name: CI

# Pull requests: every job below runs, gating the merge.
# Pushes to main: the same jobs run again as the first stage of the
# spec's "main branch" pipeline (Run Tests -> Build -> Push -> Deploy) —
# deploy.yml picks up from here via workflow_run, only after this
# workflow succeeds (see that file's trigger).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — install, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Unit tests
        # No external services needed here by design (see backend/tests/conftest.py) —
        # this is the fast gate; integration-tests below is the slow, real-infra one.
        working-directory: backend
        run: pytest -v --ignore=tests/integration

  frontend:
    name: Frontend — install, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Next.js route types
        # Route helper types like LayoutProps (used in src/app/layout.tsx)
        # are generated, not hand-written — normally produced as a side
        # effect of `next dev`/`next build`. On a genuinely fresh checkout
        # (no .next/ directory yet) they don't exist until something
        # generates them, so a standalone type-check has to ask for them
        # explicitly first. Found by CI itself failing on the very first
        # real run of this workflow — a fresh checkout is exactly what a
        # local dev machine, with months of accumulated .next/ output,
        # doesn't actually test. See docs/learning/PHASE_9_CICD.md.
        working-directory: frontend
        run: npx next typegen

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Build
        working-directory: frontend
        run: npm run build

  integration-tests:
    name: Integration tests (real Postgres + Redis + Celery worker)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        # This one command also serves as the "Docker Build" pipeline step —
        # docker-compose.yml builds all three images (backend, celery-worker,
        # frontend) before starting them; a broken Dockerfile fails right here.
        run: docker compose up --build -d

      - name: Wait for the backend to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then
              echo ""
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became healthy within 60s" >&2
          docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (for the pytest client running these tests)
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Seed the database
        # Required for the integration tests that log in as the seeded admin
        # account (see backend/tests/integration/conftest.py's admin_headers_integration).
        run: docker compose exec -T backend python -m app.seed

      - name: Run integration tests
        working-directory: backend
        run: pytest tests/integration -v

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
